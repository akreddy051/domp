spring.application.name=order-service

server.port = 0

# ===============================
# Eureka Server Registration
# ===============================
eureka.client.service-url.defaultZone: http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}


# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/domp
spring.datasource.username=root
spring.datasource.password=Akreddy051@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SSL Configuration
# ===============================
server.ssl.enabled=true
server.ssl.key-store=classpath:ssl/order-service-keystore.p12
# Keystore password
server.ssl.key-store-password=akshay
# Keystore type (modern standard)
server.ssl.key-store-type=PKCS12
# Alias of the key inside keystore
server.ssl.key-alias=order-service

